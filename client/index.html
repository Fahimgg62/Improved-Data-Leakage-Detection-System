<!DOCTYPE html>
<html class="dark" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LeakTrace • React Forensic Watermarking Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#4f6bff",
              "primary-container": "#1e295d",
              "on-primary": "#ffffff",
              "secondary": "#22d3ee",
              "secondary-container": "#083344",
              "on-secondary": "#082f49",
              "background": "#0b1220",
              "surface": "#0c1321",
              "surface-dim": "#070e1c",
              "surface-container-lowest": "#070e1c",
              "surface-container-low": "#121a2b",
              "surface-container": "#151e32",
              "surface-container-high": "#19243d",
              "surface-container-highest": "#212f4f",
              "on-surface": "#e2e8f0",
              "on-surface-variant": "#94a3b8",
              "outline": "#64748b",
              "outline-variant": "#334155",
              "error": "#ef4444",
              "error-container": "#450a0a",
              "warning": "#f59e0b",
              "success": "#22c55e"
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace']
            }
          }
        }
      };
    </script>
    <style>
      body {
        background-color: #0b1220;
        color: #e2e8f0;
        font-family: 'Inter', sans-serif;
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #0c1321;
      }
      ::-webkit-scrollbar-thumb {
        background: #1e293b;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #334155;
      }
    </style>
  </head>
  <body class="bg-background text-on-surface min-h-screen antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
