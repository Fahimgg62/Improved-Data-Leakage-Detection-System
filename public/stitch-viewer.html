<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Stitch Design Gallery • LeakTrace (21 Screens)</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#4f6bff",
            "secondary": "#22d3ee",
            "background": "#0b1220",
            "surface": "#0c1321",
            "surface-container": "#151e32",
            "surface-container-high": "#19243d",
            "outline": "#64748b",
            "outline-variant": "#334155"
          }
        }
      }
    };
  </script>
</head>
<body class="bg-background text-slate-100 min-h-screen antialiased flex flex-col font-sans">
  
  <header class="h-16 bg-surface border-b border-outline-variant px-6 flex items-center justify-between sticky top-0 z-30">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-surface-container flex items-center justify-center border border-outline-variant">
        <span class="material-symbols-outlined text-secondary">grid_view</span>
      </div>
      <div>
        <h1 class="text-sm font-bold text-white flex items-center gap-2">
          <span>Stitch Prototype Screen Catalog</span>
          <span class="text-[10px] px-2 py-0.5 rounded bg-primary/20 text-primary font-mono">21 Screens</span>
        </h1>
        <p class="text-[11px] text-outline font-mono">Project #8064901582218045700 • LeakTrace Forensic Platform</p>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <a href="/" class="px-3.5 py-1.5 rounded-lg bg-primary hover:bg-primary/90 text-white text-xs font-medium flex items-center gap-1.5 transition-colors">
        <span class="material-symbols-outlined text-sm">home</span>
        <span>Open Functional App</span>
      </a>
    </div>
  </header>

  <div class="flex-1 flex overflow-hidden">
    <!-- Sidebar Screen List -->
    <aside class="w-80 bg-surface border-r border-outline-variant overflow-y-auto p-4 flex flex-col gap-1">
      <div class="text-[11px] font-mono text-outline uppercase tracking-wider px-2 py-1">21 Design Screens</div>
      
      <div id="screen-list" class="space-y-1">
        <!-- Injected via JavaScript -->
      </div>
    </aside>

    <!-- Preview Frame -->
    <main class="flex-1 flex flex-col bg-slate-950">
      <div class="h-10 bg-surface/60 border-b border-outline-variant/60 px-4 flex items-center justify-between text-xs font-mono text-outline">
        <span id="current-screen-name">Loading preview...</span>
        <a id="btn-open-raw" href="#" target="_blank" class="text-secondary hover:underline flex items-center gap-1">
          <span>Open Fullscreen</span>
          <span class="material-symbols-outlined text-xs">open_in_new</span>
        </a>
      </div>
      <iframe id="preview-frame" class="flex-1 w-full h-full border-0 bg-surface" src="/stitch/dashboard.html"></iframe>
    </main>
  </div>

  <script>
    const screens = [
      { name: 'dashboard.html', label: 'Security Operations Dashboard', category: 'SOC Command' },
      { name: 'admin_dashboard.html', label: 'Admin Dashboard Overview', category: 'SOC Command' },
      { name: 'signin.html', label: 'Sign In (Auth)', category: 'Authentication' },
      { name: 'mfa_challenge.html', label: 'MFA Challenge Verification', category: 'Authentication' },
      { name: 'upload.html', label: 'Secure File Ingestion', category: 'Vault & Upload' },
      { name: 'secure_file_vault.html', label: 'Secure File Vault & Distribution', category: 'Vault & Upload' },
      { name: 'master_files.html', label: 'Master Files & Ledger', category: 'Vault & Upload' },
      { name: 'overview_and_files.html', label: 'Overview & Files Explorer', category: 'Vault & Upload' },
      { name: 'assign.html', label: 'Assign Agents Workflow', category: 'Distribution' },
      { name: 'shared_with_agents.html', label: 'Shared with Agents Ledger', category: 'Distribution' },
      { name: 'authorized_agents.html', label: 'Authorized Agents & Enclaves', category: 'Enclaves' },
      { name: 'investigate.html', label: 'Forensic Leak Analysis & Attribution', category: 'Forensic Lab' },
      { name: 'forensic_extraction_lab.html', label: 'Forensic Extraction Lab', category: 'Forensic Lab' },
      { name: 'leak_analysis.html', label: 'Leak Analysis Workspace', category: 'Forensic Lab' },
      { name: 'audit_logs.html', label: 'Audit Trail & Compliance Ledger', category: 'Compliance' },
      { name: 'agent_workspace.html', label: 'Agent Workspace & My Files', category: 'Agent Portal' },
      { name: 'agent_document_portal.html', label: 'Agent Document Portal', category: 'Agent Portal' },
      { name: 'agent_recipient_portal.html', label: 'Agent Recipient Portal', category: 'Agent Portal' },
      { name: 'employee_file_detail.html', label: 'Employee File Detail Inspector', category: 'Agent Portal' },
      { name: 'admin_security_settings.html', label: 'Admin Security & Profile Settings', category: 'Settings' },
      { name: 'employee_security_settings.html', label: 'Employee Security Settings', category: 'Settings' }
    ];

    const listContainer = document.getElementById('screen-list');
    const iframe = document.getElementById('preview-frame');
    const titleEl = document.getElementById('current-screen-name');
    const openRawBtn = document.getElementById('btn-open-raw');

    screens.forEach((s, idx) => {
      const btn = document.createElement('button');
      btn.className = `w-full text-left p-2.5 rounded-lg border border-outline-variant/40 hover:bg-surface-container transition-colors flex flex-col gap-0.5 ${idx === 0 ? 'bg-surface-container border-primary/50' : 'bg-surface/50'}`;
      btn.innerHTML = `
        <div class="text-xs font-semibold text-white truncate">${s.label}</div>
        <div class="flex items-center justify-between text-[10px] text-outline font-mono">
          <span>${s.category}</span>
          <span class="text-secondary">${s.name}</span>
        </div>
      `;
      btn.onclick = () => selectScreen(s, btn);
      listContainer.appendChild(btn);
    });

    function selectScreen(screen, clickedBtn) {
      document.querySelectorAll('#screen-list button').forEach(b => {
        b.classList.remove('bg-surface-container', 'border-primary/50');
        b.classList.add('bg-surface/50');
      });
      clickedBtn.classList.remove('bg-surface/50');
      clickedBtn.classList.add('bg-surface-container', 'border-primary/50');

      const path = `/stitch/${screen.name}`;
      iframe.src = path;
      titleEl.innerText = `${screen.label} • (${screen.name})`;
      openRawBtn.href = path;
    }

    // Default select first
    selectScreen(screens[0], listContainer.children[0]);
  </script>
</body>
</html>
